name: release

# v0.1.2 같은 태그가 올라오면 GitHub이 윈도우 머신을 빌려 설치 파일을 굽고
# Release까지 만들어 올린다. 내 PC에서 빌드할 필요가 없다.
#   npm version patch && git push --follow-tags
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Release 생성/업로드에 필요

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 빌드만 한다. electron-builder 자체 publisher는 릴리스를 중복 생성하는
      # 경합이 있어서 쓰지 않는다(초안 2개가 생기고 자산이 쪼개졌다).
      - run: npx electron-builder --win --publish never

      # 같은 태그의 릴리스가 있으면 재사용하는 우리 스크립트로 올린다.
      # 설치 파일·latest.yml·blockmap 셋이 다 있어야 앱이 업데이트를 본다.
      - run: node tools/release.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 빌드가 깨졌을 때 들여다볼 수 있게 결과물 목록을 남긴다
      - if: always()
        run: Get-ChildItem dist -File | Select-Object Name, Length
        shell: pwsh
