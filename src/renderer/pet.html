<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
  <title>Claude Pet</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <!--
    옆모습 고양이. 기본은 오른쪽을 보고 있고, .facing-left 가 좌우로 뒤집는다.
    머리·몸통·다리를 같은 그라데이션으로 겹쳐 하나의 실루엣처럼 보이게 했다.

    좌표는 128x128 안에 모두 들어와야 한다. 창 밖으로 나가면 그대로 잘린다.
    특히 꼬리는 stroke 두께의 절반만큼 더 나간다는 걸 감안할 것.

    나중에 이미지로 바꾸려면 <g id="pet"> 안을 <image> 로 갈아끼우면 된다.
  -->
  <svg id="stage" viewBox="0 0 128 128" class="mode-idle facing-right" aria-hidden="true">
    <defs>
      <!--
        몸 전체를 가로지르는 세로 그라데이션. userSpaceOnUse 라서 머리·몸통·다리가
        각자 따로 칠해지지 않고 하나의 덩어리처럼 이어진다.
        색은 pet.css 의 stop-color 가 정한다.
      -->
      <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="122">
        <stop id="fur-top" offset="0" />
        <stop id="fur-bottom" offset="1" />
      </linearGradient>
      <linearGradient id="fur-far" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="122">
        <stop id="fur-far-top" offset="0" />
        <stop id="fur-far-bottom" offset="1" />
      </linearGradient>
    </defs>

    <!-- 바닥 그림자: 클릭 판정에서 빼려고 pet 그룹 밖에 둔다 -->
    <ellipse id="shadow" cx="56" cy="124" rx="40" ry="4.5" />

    <g id="pet">
      <!-- 꼬리 — 끝을 살짝 말아 올린다 -->
      <path id="tail" d="M 26 74 C 12 70 10 52 19 44 C 22 40 27 41 28 45" />

      <!-- 반대편 다리 — 아주 살짝만 어둡게 해서 깊이만 준다 -->
      <g id="legs-far">
        <rect class="leg far leg-a" x="25" y="88" width="13" height="36" rx="6.5" />
        <rect class="leg far leg-b" x="66" y="88" width="13" height="36" rx="6.5" />
      </g>

      <!-- 반대편 귀 -->
      <path id="ear-far" class="ear far" d="M 96 32 C 97 21 102 15 108 16 C 113 21 113 29 108 35 Z" />

      <g id="body">
        <!-- 타원 하나만 쓰면 딱딱해 보여서, 엉덩이·가슴에 뭉실한 덩어리를 겹쳤다 -->
        <ellipse id="torso" cx="54" cy="80" rx="39" ry="23" />
        <circle id="fluff-rear" cx="26" cy="79" r="19" />
        <circle id="fluff-chest" cx="76" cy="77" r="22" />
        <circle id="head" cx="86" cy="52" r="29" />
        <path id="ear-near" class="ear" d="M 68 33 C 68 20 72 12 78 12 C 85 16 89 25 89 33 Z" />

        <g id="face">
          <!-- 평소엔 기분 좋게 감은 눈 -->
          <g id="eyes-closed">
            <path class="eye-arc" d="M 71 48 q 5.5 6 11 0" />
            <path class="eye-arc" d="M 91 48 q 5.5 6 11 0" />
          </g>
          <!-- 놀라거나 생각할 때 뜨는 눈 -->
          <g id="eyes-open">
            <ellipse class="eyeball" cx="76.5" cy="49" rx="4.4" ry="5.4" />
            <circle class="glint" cx="78.1" cy="46.9" r="1.7" />
            <ellipse class="eyeball" cx="96.5" cy="49" rx="4.4" ry="5.4" />
            <circle class="glint" cx="98.1" cy="46.9" r="1.7" />
          </g>
          <ellipse class="blush" cx="66" cy="59" rx="7.5" ry="4.2" />
          <ellipse class="blush" cx="105" cy="59" rx="7.5" ry="4.2" />
          <path id="mouth" d="M 81 61 q 3.5 4 7 0 q 3.5 4 7 0" />
        </g>
      </g>

      <!-- 가까운 쪽 다리 (몸통 앞) -->
      <g id="legs-near">
        <rect class="leg leg-b" x="36" y="88" width="13" height="36" rx="6.5" />
        <rect class="leg leg-a" x="77" y="88" width="13" height="36" rx="6.5" />
      </g>
    </g>

    <!--
      새 답변 알림 뱃지. 좌우 반전에 같이 뒤집히면 안 되므로 #pet 밖에 둔다.
      평소엔 숨어 있고 .notify 일 때만 보인다.
    -->
    <g id="badge">
      <circle id="badge-bg" cx="109" cy="19" r="14" />
      <path id="badge-mark" d="M 109 13 v 7.5" />
      <circle id="badge-dot" cx="109" cy="25" r="2.3" />
    </g>
  </svg>

  <script src="pet.js"></script>
</body>
</html>
